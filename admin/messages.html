<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الرسائل والطلبات — لوحة تحكم جمعية الشمال للتنمية والتطوير المجتمعي</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f6f5f2">
  <link rel="icon" type="image/png" href="../img/logo.png">
  <script>(function(){try{var d=document.documentElement,t=localStorage.getItem('almel-admin-theme');if(t==='dark')d.classList.add('dark');if(localStorage.getItem('almel-admin-sb')==='1')d.classList.add('sb-collapsed');}catch(e){}})();</script>
  <link rel="stylesheet" href="../css/fonts.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body data-page="messages">
  <a class="skip-link" href="#main">تخطَّ إلى المحتوى</a>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="القائمة الجانبية"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="main" tabindex="-1">

        <div class="page-head">
          <div><h1 class="page-title">الرسائل والطلبات</h1><p class="page-sub" id="m-sub" aria-live="polite"></p></div>
          <div class="page-actions"><button type="button" class="btn btn-secondary" id="m-readall"><span class="material-symbols-outlined" aria-hidden="true">done_all</span>تعليم الكل كمقروء</button></div>
        </div>
        <section class="card inbox" id="inbox" aria-label="صندوق الرسائل">
          <div class="inbox-list">
            <div class="inbox-filters">
              <label class="input-icon"><span class="sr-only">بحث في الرسائل</span><span class="material-symbols-outlined" aria-hidden="true">search</span><input class="input sm" id="m-search" type="search" placeholder="ابحث في الرسائل…" autocomplete="off"></label>
              <div class="seg" id="m-box" role="group" aria-label="تصفية الرسائل">
                <button type="button" data-value="all" aria-pressed="true">الكل</button>
                <button type="button" data-value="unread" aria-pressed="false">غير مقروءة</button>
                <button type="button" data-value="starred" aria-pressed="false">المميزة</button>
                <button type="button" data-value="archived" aria-pressed="false">الأرشيف</button>
              </div>
              <div class="chips type-chips" role="group" aria-label="نوع الرسالة">
                <button type="button" class="chip-btn" data-type="" aria-pressed="true">كل الأنواع</button>
                <button type="button" class="chip-btn" data-type="contact" aria-pressed="false">تواصل</button>
                <button type="button" class="chip-btn" data-type="volunteer" aria-pressed="false">تطوع</button>
                <button type="button" class="chip-btn" data-type="donation" aria-pressed="false">استفسار تبرع</button>
              </div>
            </div>
            <ul class="inbox-items" id="m-list" role="listbox" aria-label="الرسائل"></ul>
          </div>
          <section class="reader" id="m-reader" aria-label="قراءة الرسالة"></section>
        </section>
      </main>
    </div>
  </div>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <script src="js/admin-data.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
